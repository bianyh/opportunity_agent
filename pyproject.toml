[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity-agent-demo"
version = "0.1.0"
description = "Personal Opportunity Awareness Agent V1 demo"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.28"]
resume = ["pdfplumber>=0.11,<0.12", "python-docx>=1.2,<2", "python-multipart>=0.0.20,<1", "olefile>=0.47,<1"]
v2 = [
  "dateparser>=1.2,<2",
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1", "aiosqlite>=0.20,<1", "alembic>=1.13,<2",
  "pgvector>=0.3,<1", "redis>=5,<6", "PyJWT[crypto]>=2,<3", "argon2-cffi>=23,<26",
  "langgraph>=0.2,<1", "mcp>=1,<2", "opentelemetry-api>=1,<2",
  "opentelemetry-sdk>=1,<2",
  "openjiuwen[all-a2a]==0.1.19"
]
rag = ["sentence-transformers>=3,<6"]
observability = ["opentelemetry-exporter-otlp-proto-http>=1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["opportunity_agent*"]

[tool.setuptools.package-data]
opportunity_agent = ["skills/*/SKILL.md", "v2/web/*", "v2/evaluation/*.html", "v2/evaluation/*.js", "v2/evaluation/*.css"]
